<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170A1E" id="theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>German Pink Cardigan App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  /* Studio bei Nacht: ruhige Pflaume als Grund, Farbe nur als Signal für Account und Status. Der Strick bleibt das eine Markenzeichen. */
  --ink:#170A1E; --panel:#231029; --raise:#2F1838; --plum:#2B0A33; --wool:#FFF3F8;
  --pink:#FF5CA8; --lilac:#C8B0FF; --violet:#9D74FF; --butter:#FFE14D; --clover:#39D98A; --cobalt:#6C7BFF;
  --display:'Bricolage Grotesque',ui-rounded,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Bricolage Grotesque',ui-rounded,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --glide:cubic-bezier(.3,1.25,.5,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink)}
body{font:500 16px/1.4 var(--body);color:var(--wool);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3,p{margin:0}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.app{--bg:var(--ink);--fg:var(--wool);--soft:rgba(255,243,248,.68);--line:rgba(255,243,248,.13);--act:var(--pink);--act-fg:var(--plum);--acc:var(--pink);
  position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);overflow:hidden}
.app::before{content:'';position:absolute;inset:0 0 auto;height:230px;pointer-events:none;background:radial-gradient(85% 100% at 12% 0,color-mix(in srgb,var(--acc) 22%,transparent),transparent 72%)}
.app[data-world=f-ayri]{--acc:var(--lilac)}
.app[data-world=f-twitch]{--acc:var(--violet)}

.top{position:relative;flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 6px}
.mark{font-weight:700;font-size:14px;letter-spacing:-.005em;white-space:nowrap;color:var(--soft)}
.tag{flex:none;font-size:12.5px;font-weight:600;line-height:1;padding:7px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}

.view{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.title{font:800 44px/1.02 var(--display);font-stretch:78%;letter-spacing:-.022em;text-wrap:balance}
.title.small{font-size:34px;line-height:1.06;overflow-wrap:anywhere}
.head{display:flex;flex-direction:column;gap:3px}
.sub{color:var(--soft);font-size:15px}
.h2{font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.count{font-size:12.5px;font-weight:700;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(255,243,248,.1);color:var(--fg);display:inline-grid;place-items:center}
section{display:flex;flex-direction:column}
section>.h2{margin-bottom:4px}

.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.grow b{font-weight:600;font-size:15.5px;line-height:1.28}
.grow small{font-size:13.5px;color:var(--soft);line-height:1.3}
.row.done b{text-decoration:line-through;opacity:.6}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 18px;border-radius:14px;background:var(--act);color:var(--act-fg);font-weight:700;font-size:16px;line-height:1.15;text-align:center;transition:transform .16s ease,opacity .16s}
.btn:active{transform:scale(.98);opacity:.9}
.btn.ghost{background:rgba(255,243,248,.05);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.link{align-self:center;font-weight:600;font-size:14.5px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;padding:10px 8px;min-height:44px}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.cb{flex:none;width:32px;height:32px;border-radius:50%;color:var(--soft);transition:transform .2s var(--spring)}
.cb:active{transform:scale(.88)}
.cb svg{width:32px;height:32px}
.cb .base{transition:fill .2s,stroke .2s}
.cb .th{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease}
.cb[aria-pressed=true]{color:var(--plum)}
.cb[aria-pressed=true] .base{fill:var(--pink);stroke:var(--pink)}
.cb[aria-pressed=true] .th{stroke-dashoffset:0}
.dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.dot svg{width:17px;height:17px}

.hero{position:relative;display:block;width:100%}
.hero canvas{display:block;width:100%;border-radius:16px;background:var(--panel)}
.sewn{position:absolute;right:12px;top:10px;z-index:1;font-size:12.5px;font-weight:600;line-height:1;padding:6px 9px;border-radius:999px;background:rgba(23,10,30,.82);color:var(--wool)}
.cap{font-weight:600;font-size:16px;margin-top:-8px}
.cap small{display:block;font-size:13.5px;font-weight:500;color:var(--soft)}

.hint{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;background:var(--panel);color:var(--fg);font-weight:600;font-size:15px;line-height:1.25;transition:transform .16s ease}
.hint:active{transform:scale(.985)}
.hint svg{flex:none;width:21px;height:21px;color:var(--acc)}
.hint small{display:block;font-weight:500;font-size:13.5px;color:var(--soft)}

.mini{flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--panel)}
.mini canvas{display:block;width:100%}
.pill{flex:none;font-size:12.5px;font-weight:600;line-height:1;padding:6px 9px;border-radius:999px;background:var(--p,rgba(255,243,248,.1));color:var(--pt,var(--fg));white-space:nowrap}
.pill.neu,.pill.schnitt{--p:rgba(255,92,168,.17);--pt:#FF8FC3}
.pill.frei,.pill.mat{--p:rgba(255,225,77,.14);--pt:var(--butter)}
.pill.lauf{--p:rgba(108,123,255,.2);--pt:#B4BBFF}
.pill.geld,.pill.online{--p:rgba(57,217,138,.15);--pt:var(--clover)}
.pill.leer{--p:transparent;--pt:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}

.back{display:flex;align-items:center;gap:4px;font-weight:600;font-size:14.5px;color:var(--soft);min-height:38px;align-self:flex-start}
.back svg{width:18px;height:18px}
.patch{position:relative}
.patch canvas{display:block;width:100%;border-radius:16px;background:var(--panel)}
.note{font-size:13.5px;color:var(--soft)}
.bar{height:8px;border-radius:4px;background:rgba(255,243,248,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px}
.prog{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:38px;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;line-height:1.1;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line);transition:background-color .16s,color .16s}
.chip[aria-pressed=true]{background:var(--fg);color:var(--ink);box-shadow:none}
.stamp{position:absolute;right:12px;top:12px;z-index:2;pointer-events:none}
.stamp span{display:block;padding:7px 12px;border-radius:999px;background:var(--clover);color:var(--plum);font-weight:700;font-size:14px;line-height:1}

.pad{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:var(--panel)}
.pad textarea{width:100%;min-height:76px;resize:none;border:0;background:transparent;font-size:17px;font-weight:500;line-height:1.35;padding:4px;outline:none;color:var(--fg)}
.pad textarea::placeholder{color:var(--soft)}
.pad:focus-within{box-shadow:0 0 0 1.5px var(--acc)}
.pad .btn{min-height:46px}
.err{color:#FF9DC8;font-size:14.5px;font-weight:600}
.wall{columns:2;column-gap:10px}
.st{display:block;width:100%;margin:0 0 10px;break-inside:avoid;padding:13px 13px 11px 15px;border-radius:12px;background:var(--panel);color:var(--fg);font-weight:600;font-size:15px;line-height:1.28;box-shadow:inset 3px 0 0 var(--c);transition:transform .16s ease}
.st:active{transform:scale(.98)}
.st small{display:block;margin-top:7px;font-size:12.5px;font-weight:500;color:var(--soft)}
.st.gone{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}
.slap{animation:slap .42s var(--spring) both}
@keyframes slap{from{transform:scale(.8);opacity:0}}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;min-height:62px;border-radius:12px;background:var(--panel);font-size:12.5px;font-weight:600;line-height:1.1;color:var(--soft)}
.day b{font:700 18px/1.2 var(--body);font-variant-numeric:tabular-nums;color:var(--fg)}
.day i{width:5px;height:5px;border-radius:50%;background:var(--pink);margin-top:3px;visibility:hidden}
.day.has i{visibility:visible}
.day[aria-pressed=true]{background:var(--pink);color:var(--plum)}
.day[aria-pressed=true] b{color:var(--plum)}
.day[aria-pressed=true] i{background:var(--plum)}
.day.today:not([aria-pressed=true]){box-shadow:inset 0 0 0 1px var(--soft)}
.when{flex:none;width:54px;display:flex;flex-direction:column;align-items:flex-start}
.when b{font:700 16px/1.1 var(--body);font-variant-numeric:tabular-nums}
.when small{font-size:12.5px;color:var(--soft);line-height:1.2}
.ty{flex:none;width:4px;align-self:stretch;min-height:36px;border-radius:2px;background:var(--c)}
.grp{font-weight:700;font-size:14px;color:var(--soft);margin-top:12px}
.grp:first-child{margin-top:0}

.deal{display:flex;flex-direction:column;gap:3px;width:100%;padding:14px;background:var(--panel);color:var(--fg);border-radius:14px;transition:transform .16s ease}
.deal:active{transform:scale(.985)}
.deal .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deal .n{font:700 19px/1.15 var(--display);font-stretch:85%;letter-spacing:-.012em}
.deal small{font-size:14.5px;line-height:1.3;color:var(--soft)}
.deal .m{font-weight:700;color:var(--fg)}
.deals{display:flex;flex-direction:column;gap:8px}

.layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(10,4,14,.66);opacity:0;transition:opacity .2s ease}
.layer.open .scrim{opacity:1}
.sheet{--bg:var(--raise);--line:rgba(255,243,248,.14);
  position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:var(--bg);color:var(--fg);border-radius:22px 22px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(102%);transition:transform .34s cubic-bezier(.2,1,.3,1);outline:none}
.layer.open .sheet{transform:none}
.sheet h2{font:800 26px/1.08 var(--display);font-stretch:80%;letter-spacing:-.018em;padding-right:44px;overflow-wrap:anywhere}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--soft)}
.x svg{width:22px;height:22px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-weight:600;font-size:14px;color:var(--soft)}
.field input,.field select,.field textarea{width:100%;min-width:0;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-size:16px;padding:11px 12px;color:var(--fg)}
.field textarea{resize:none;line-height:1.4}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.quote{background:rgba(255,243,248,.06);border-radius:12px;padding:12px 14px;white-space:pre-line;font-size:15.5px;line-height:1.45}
.fold{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,243,248,.07);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.fold svg{flex:none;width:22px;height:22px;color:var(--pink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--ink)}
.seg button{min-height:44px;border-radius:10px;font-weight:600;font-size:14.5px;text-align:center;line-height:1.1;padding:4px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--pink);color:var(--plum)}

.res{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px;margin:0}
.res dt{color:var(--soft)}
.res dd{margin:0;font-weight:600;overflow-wrap:anywhere;text-align:right}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--panel)}
.verdict{padding:11px 13px;border-radius:10px;font-weight:600;line-height:1.3;color:var(--plum)}
.verdict.ok{background:var(--clover)}
.verdict.bad{background:var(--pink)}
.verdict.hm{background:var(--butter)}
.steps{display:flex;flex-direction:column;gap:5px;margin:0;padding-left:20px;font-size:15px;color:var(--soft)}

.shelf,.subs{display:grid;gap:17px 8px}
.shelf{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:8px}
.subs{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:8px}
.fo{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;width:100%;min-height:82px;padding:10px 11px;border-radius:3px 12px 12px 12px;background:var(--panel);color:var(--fg);font-weight:600;font-size:14.5px;line-height:1.18;overflow-wrap:anywhere;transition:transform .16s ease,background-color .16s}
.fo::before{content:'';position:absolute;left:0;top:-7px;width:42%;height:8px;border-radius:5px 5px 0 0;background:var(--c)}
.fo:active{transform:scale(.97);background:var(--raise)}
.fo small{font-size:12.5px;font-weight:500;color:var(--soft);line-height:1.2}
.addf{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:42px;padding:8px 12px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.15;text-align:center;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.addf svg{width:16px;height:16px;flex:none}
.shelf .addf{grid-column:1/-1;margin-top:-7px}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:13px;background:var(--panel)}
.sp{display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;padding:6px 3px;border-radius:9px;font-weight:600;font-size:13px;line-height:1.1;text-align:center;color:var(--soft);transition:background-color .16s,color .16s}
.sp::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.sp[aria-pressed=true]{background:var(--raise);color:var(--fg)}

.rstat{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;background:var(--panel)}
.ring{flex:none;width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .t{stroke:rgba(255,243,248,.12)}
.ring .v{stroke:var(--pink);stroke-linecap:round;stroke-dasharray:1 1;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rstat b{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.rstat small{display:block;font-size:13.5px;color:var(--soft);line-height:1.3}
.rhud{position:sticky;top:-4px;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 14px;border-radius:13px;background:var(--raise);box-shadow:0 8px 22px rgba(10,4,14,.5);font-weight:700;font-size:15px}
.rhud button{flex:none;min-height:36px;padding:6px 12px;border-radius:9px;background:var(--pink);color:var(--plum);font-weight:700;font-size:13.5px;line-height:1.1}
.rhud button.on{background:var(--wool)}
.road{position:relative;flex:none;margin:0 -16px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.road svg.line{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.rtrack{fill:none;stroke:rgba(255,243,248,.2);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 9}
.rdone{fill:none;stroke:var(--pink);stroke-width:3.5;stroke-linecap:round}
.mon{position:absolute;left:0;top:0;z-index:2;padding:5px 11px;border-radius:999px;background:var(--panel);box-shadow:0 0 0 1px var(--line);font-size:12.5px;font-weight:600;line-height:1.1;white-space:nowrap;color:var(--soft);transition:transform .55s var(--glide),background-color .2s,color .2s}
.mon.on{background:var(--pink);color:var(--plum);box-shadow:none}
.mon.over{background:var(--wool);color:var(--plum)}
.ms{position:absolute;left:0;top:0;z-index:3;width:0;height:0;touch-action:pan-y;transition:transform .6s var(--glide),opacity .26s ease;-webkit-touch-callout:none}
.ms i{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 3px var(--c);transition:transform .28s var(--spring),background-color .2s}
.ms.lauf i::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--c)}
.ms.done i{background:var(--c)}
.ms span{position:absolute;top:-26px;display:block;width:var(--w);padding:7px 10px;border-radius:11px;background:var(--panel);opacity:.62;transition:opacity .22s,background-color .22s,transform .24s var(--spring)}
.ms.r span{left:20px}
.ms.l span{right:20px}
.ms b{display:block;font-weight:600;font-size:14px;line-height:1.24;overflow-wrap:anywhere}
.ms small{display:block;font-size:12px;color:var(--soft);line-height:1.25;margin-top:1px}
.ms.done b{text-decoration:line-through;text-decoration-color:var(--soft)}
.ms.near span{opacity:1;background:var(--raise)}
.ms.near i{transform:scale(1.18)}
.ms.hit i{animation:mspop .5s var(--spring)}
@keyframes mspop{40%{transform:scale(1.6)}}
.ms.lift{z-index:9;transition:none}
.ms.lift i{transform:scale(1.5)}
.ms.lift span{opacity:1;background:var(--raise);transform:scale(1.04);box-shadow:0 10px 26px rgba(10,4,14,.55)}
.ms.hide{opacity:0;pointer-events:none}
.ms.fresh i{animation:msdrop .7s var(--spring)}
@keyframes msdrop{from{transform:translateY(-70px) scale(.4);opacity:0}}
.ms:focus-visible{outline:0}
.ms:focus-visible span{outline:2px solid var(--fg)}
.roller{position:absolute;left:0;top:0;z-index:4;width:42px;height:42px;margin:-21px 0 0 -21px;pointer-events:none;will-change:transform}
.roller svg{width:42px;height:42px}

.hem{position:relative;z-index:10;flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);background:var(--ink);box-shadow:0 -1px 0 var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;font-size:11px;font-weight:600;line-height:1.2;text-align:center;color:var(--soft);transition:color .16s}
.tab .ico{width:40px;height:28px;border-radius:9px;display:grid;place-items:center;transition:background-color .16s}
.tab .ico svg{width:21px;height:21px}
.tab[aria-current=page]{color:var(--fg)}
.tab[aria-current=page] .ico{background:color-mix(in srgb,var(--pink) 24%,transparent);color:#FF8FC3}

.gate{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);background:var(--ink);overflow-y:auto}
.gate-patch{flex:none}
.gate-patch canvas{display:block;width:100%;border-radius:16px;background:var(--panel)}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate label{font-weight:600;font-size:14.5px;color:var(--soft)}
.gate input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font-size:17px;padding:12px 14px}

const G={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[28,18,17,17,17,18,28],E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],Y:[17,17,17,10,4,4,4],Z:[31,1,2,4,8,16,31],'Ä':[10,0,14,17,31,17,17],'Ö':[10,0,14,17,17,17,14],'Ü':[10,0,17,17,17,17,14],'0':[14,17,17,17,17,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],':':[0,3,3,0,3,3,0],'.':[0,0,0,0,0,3,3],'-':[0,0,0,15,0,0,0],'!':[1,1,1,1,1,0,1],'?':[14,17,1,2,4,0,4],'&':[12,18,20,8,21,18,13],',':[0,0,0,0,1,1,2],'+':[0,4,4,31,4,4,0]};

function stamp(g,cols,rows,s,x0,y0,sc,v){let x=x0;for(const c of s){if(c===' '){x+=3*sc;continue}const f=G[c];if(!f)continue;const w=glyphW(c);for(let y=0;y<7;y++)for(let i=0;i<w;i++)if(f[y]>>(w-1-i)&1)for(let a=0;a<sc;a++)for(let b=0;b<sc;b++){const rr=y0+y*sc+a,cc=x+i*sc+b;if(rr>=0&&rr<rows&&cc>=0&&cc<cols)g[rr*cols+cc]=v}x+=(w+1)*sc}}
function wrap(t,max){const words=t.toUpperCase().replace(/ß/g,'SS').replace(/-/g,'- ').split(/\s+/).filter(Boolean);const out=[];let cur='';for(let w of words){while(w.length>max){if(cur){out.push(cur);cur=''}out.push(w.slice(0,max));w=w.slice(max)}const sep=cur&&!cur.endsWith('-')?' ':'';if((cur+sep+w).length<=max)cur+=sep+w;else{out.push(cur);cur=w}}if(cur)out.push(cur);return out.slice(0,4)}

function compose(spec,w){

    const cw=Math.max(4.6,Math.min(6.4,w/62)),ch=cw*.84,cols=Math.ceil(w/cw),sc=2,top=spec.top,big=spec.big;

}
class Knit{
  constructor(cv,spec){this.cv=cv;this.spec=spec;this.p=spec.p??1;this.ctx=cv.getContext('2d');this.w=0;this.fit();

  fit(){const w=Math.round(this.cv.clientWidth);if(!w||w===this.w)return;this.w=w;this.m=compose(this.spec,w);const{rows,ch}=this.m;this.H=Math.round(rows*ch);this.cv.width=Math.round(w*DPR);this.cv.height=Math.round(this.H*DPR);this.cv.style.height=this.H+'px';this.draw()}
  draw(){
    if(!this.m)return;const{cols,rows,cw,ch,g}=this.m,x=this.ctx,y=this.spec.yarn.map(c=>sprite(c,cw,ch));

    const done=Math.round(Math.min(1,Math.max(0,this.p))*cols*rows),full=Math.floor(done/cols),part=done-full*cols;
    x.fillStyle='rgba(255,243,248,.2)';
    for(let r=0;r<rows-full-(part?1:0);r++)for(let c=0;c<cols;c+=2)x.fillRect(c*cw+cw/2-.75,r*ch+ch/2-.75,1.5,1.5);
    for(let k=0;k<=full&&k<rows;k++){const r=rows-1-k,n=k<full?cols:part;for(let i=0;i<n;i++){const c=k%2?cols-1-i:i,s=y[g[r*cols+c]];x.drawImage(s.c,c*cw-s.P,r*ch-s.P-ch*.2,s.W,s.H)}}
  }
  set(p){this.p=p;this.draw()}
  knit(ms=620){
    if(calm||document.hidden||!this.m){this.p=1;this.draw();return}
    const t0=performance.now();let live=true;
    const step=t=>{if(!live)return;const q=Math.min(1,(t-t0)/ms);this.p=1-Math.pow(1-q,1.6);this.draw();if(q<1)requestAnimationFrame(step)};
    this.p=0;this.draw();requestAnimationFrame(step);
    setTimeout(()=>{live=false;this.p=1;this.draw()},ms+260);
  }
}

class Road{

    el.innerHTML=`<svg class="line" aria-hidden="true"><path class="rtrack"/><path class="rdone" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg><div class="roller">${knob(COL.pink,COL.wool)}</div>`;
    this.svg=$('svg.line',el);this.track=$('.rtrack',el);this.done=$('.rdone',el);this.roller=$('.roller',el);
    this.pills=this.months.map(m=>{const b=document.createElement('button');b.className='mon';b.dataset.do='plan-new';b.dataset.month=m;b.textContent=m.endsWith('-01')?monthLabel(m,true):monthLabel(m);b.setAttribute('aria-label',`Ziel im ${monthLabel(m,true)} hinzufügen`);el.append(b);return b});

  }
  dress(n){
    const {p,b}=n;b.style.setProperty('--c',planColor(p.space));$('b',b).textContent=p.title;$('small',b).textContent=`${planName(p.space)}, ${PLAN_STATUS[p.status]}`;

    n.b.classList.toggle('r',right);n.b.classList.toggle('l',!right);n.b.style.setProperty('--w',`${Math.round(w)}px`);n.b.style.transform=`translate(${n.x.toFixed(1)}px,${y.toFixed(1)}px)`;

function startUpload(id,files){
  const total=files.reduce((a,f)=>a+f.mb,0),ms=calm?400:Math.min(6500,2600+files.length*900);
  V.uploading={id,files,p:0,t0:performance.now(),ms,total};paint(false);
  const k=knits.find(x=>x.kind==='title');k&&k.set(0);
  const tick=()=>{const u=V.uploading;if(!u)return;u.p=Math.min(1,(performance.now()-u.t0)/u.ms);updateUpload();if(u.p<1)setTimeout(tick,50);else finishUpload()};
  tick();
}
function updateUpload(){
  const u=V.uploading;if(!u)return;
  const k=knits.find(x=>x.kind==='title'),bar=$('#up-bar'),txt=$('#up-text'),i=Math.min(u.files.length,Math.floor(u.p*u.files.length)+1);
  if(k)k.set(u.p);if(bar)bar.style.width=`${Math.round(u.p*100)}%`;if(txt)txt.textContent=`Datei ${i} von ${u.files.length}, ${Math.round(u.p*100)} %`;
}
function finishUpload(){
  const u=V.uploading,v=video(u.id);V.uploading=null;v.clips.push(...u.files);if(v.status==='leer')v.status='material';save();
  S.todos.filter(t=>t.video===v.id).forEach(t=>t.done=true);save();
  if(V.tab==='videos'&&V.video===v.id){paint(false);const p=$('#patch');if(p){p.insertAdjacentHTML('beforeend',`<div class="stamp"><span>Fertig</span></div>`);const st=$('.stamp',p);if(!calm)st.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:380,easing:'cubic-bezier(.34,1.56,.64,1)'});burst(p)}}
  toast(`Simulation fertig: ${u.files.length} ${u.files.length===1?'Clip':'Clips'} eingestrickt, nichts wurde hochgeladen.`);
}
function videoMeta(file){return new Promise(res=>{const el=document.createElement('video'),url=URL.createObjectURL(file);let done=false;const end=r=>{if(done)return;done=true;URL.revokeObjectURL(url);res(r)};el.preload='metadata';el.muted=true;el.playsInline=true;el.onloadedmetadata=()=>end({w:el.videoWidth,h:el.videoHeight,sec:isFinite(el.duration)?el.duration:0});el.onerror=()=>end({});setTimeout(()=>end({}),5000);el.src=url;try{el.load()}catch{end({})}})}
function parseSize(s){const m=String(s).trim().replace(',','.').match(/^([\d.]+)\s*(gb|mb|kb)?$/i);if(!m)return null;const n=parseFloat(m[1]);if(!isFinite(n)||n<=0)return null;const u=(m[2]||'mb').toLowerCase();return u==='gb'?n*1000:u==='kb'?n/1000:n}

function leaveTo(p){
  V.custom=null;V.video=null;
  if(p==='root'){V.tab='heute';V.folder=null}
  else if(p.startsWith('space:')){V.tab='heute';V.folder=p.slice(6);V.space=V.folder}
  else if(p.startsWith('sub:')){const[,k,sub]=p.split(':');V.space=k;if(TAB_KEYS.includes(sub)){V.tab=sub;V.folder=null}else{V.tab='heute';V.folder=k;V.custom=p}}
  else if(p.startsWith('video:')){V.tab='videos';V.video=p.slice(6)}

  paint(true);
}

function gateHash(str,seed=20261106){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
let bootData={};
function boot(d){

  try{open=localStorage.getItem(GATE_KEY)===String(GATE)}catch{}

}
