<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5CA8" id="theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>German Pink Cardigan App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Gasoek+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Patchwork-Cardigan: jeder Bereich ist ein eigener Flicken, Farbe heißt Ort. Grobstrick in der Schrift, echte Maschen im Hero. */
  --pink:#FF5CA8; --plum:#2B0A33; --butter:#FFE14D; --cobalt:#2F3CF0; --clover:#1FCB82; --wool:#FFF3F8; --lilac:#C8B0FF; --violet:#7B3FF2;
  --display:'Gasoek One','Arial Black',Impact,sans-serif;
  --body:'Bricolage Grotesque',ui-rounded,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--plum)}
body{font:500 16px/1.35 var(--body);color:var(--plum);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3,p{margin:0}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.app{--bg:var(--pink);--fg:var(--plum);--soft:rgba(43,10,51,.78);--line:rgba(43,10,51,.36);--act:var(--plum);--act-fg:var(--wool);
  position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);overflow:hidden}
.app[data-world=videos]{--bg:var(--plum);--fg:var(--wool);--soft:rgba(255,243,248,.78);--line:rgba(255,243,248,.32);--act:var(--pink);--act-fg:var(--plum)}
.app[data-world=ideen]{--bg:var(--butter);--act:var(--plum);--act-fg:var(--butter)}
.app[data-world=kalender]{--bg:var(--cobalt);--fg:var(--wool);--soft:rgba(255,243,248,.84);--line:rgba(255,243,248,.38);--act:var(--butter);--act-fg:var(--plum)}
.app[data-world=deals]{--bg:var(--clover);--act:var(--plum);--act-fg:var(--clover)}
.app[data-world=f-ayri]{--bg:var(--lilac);--act:var(--plum);--act-fg:var(--lilac)}
.app[data-world=f-twitch]{--bg:var(--violet);--fg:var(--wool);--soft:rgba(255,243,248,.86);--line:rgba(255,243,248,.38);--act:var(--butter);--act-fg:var(--plum)}

.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 4px}
.mark{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.tag{flex:none;font-size:13px;font-weight:700;line-height:1;padding:8px 11px;min-height:32px;background:var(--wool);color:var(--plum);border-radius:3px;border-inline:3px dashed rgba(43,10,51,.45);transition:transform .18s var(--spring)}
.tag:active{transform:scale(.95)}

.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 16px 30px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.title{font:400 clamp(58px,17vw,74px)/.95 var(--display);letter-spacing:-.005em}
.title.small{font-size:clamp(38px,11.5vw,50px);line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.head{display:flex;flex-direction:column;gap:4px}
.sub{color:var(--soft);font-size:16px}
.h2{font-weight:800;font-size:20px;line-height:1.2;display:flex;align-items:center;gap:8px}
.count{font-size:13px;font-weight:800;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--fg);color:var(--bg);display:inline-grid;place-items:center}
section{display:flex;flex-direction:column}
section>.h2{margin-bottom:2px}

.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:2px dashed var(--line);width:100%}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.grow b{font-weight:700;font-size:16px;line-height:1.25}
.grow small{font-size:14px;color:var(--soft);line-height:1.3}
.row.done b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.72}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 18px;border-radius:18px;background:var(--act);color:var(--act-fg);font-weight:800;font-size:17px;line-height:1.15;text-align:center;outline:2px dashed currentColor;outline-offset:-6px;transition:transform .18s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--fg);outline:0;box-shadow:inset 0 0 0 2.5px var(--fg)}
.btn svg{width:22px;height:22px;flex:none}
.link{align-self:center;font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:10px 8px;min-height:44px}
:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--fg)!important}
.btn.ghost:focus-visible{box-shadow:inset 0 0 0 2.5px var(--fg),0 0 0 3px var(--bg),0 0 0 6px var(--fg)!important}

.cb{flex:none;width:38px;height:38px;border-radius:50%;transition:transform .22s var(--spring)}
.cb:active{transform:scale(.86) rotate(-20deg)}
.cb svg{width:38px;height:38px}
.cb .th{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease}
.cb[aria-pressed=true] .th{stroke-dashoffset:0}
.dot{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2.5px var(--fg)}
.dot svg{width:20px;height:20px}

.hero{position:relative;display:block;width:100%;transform:rotate(-1.2deg);transition:transform .22s var(--spring)}
.hero:active{transform:rotate(-1.2deg) scale(.98)}
.hero canvas{display:block;width:100%;border-radius:20px;background:#1B0620}
.sewn{position:absolute;left:14px;top:-11px;z-index:1;font-size:14px;font-weight:800;line-height:1;padding:7px 10px;background:var(--butter);color:var(--plum);border-radius:3px;border-inline:3px dashed rgba(43,10,51,.45);transform:rotate(2.6deg)}
.cap{font-weight:700;font-size:17px;margin-top:-6px}
.cap small{display:block;font-size:14px;font-weight:500;color:var(--soft)}

.hint{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:var(--butter);color:var(--plum);font-weight:700;font-size:15px;line-height:1.25;transition:transform .18s var(--spring)}
.hint:active{transform:scale(.97)}
.hint svg{flex:none;width:22px;height:22px}
.hint small{display:block;font-weight:500;font-size:14px}

.mini{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;background:#1B0620}
.mini canvas{display:block;width:100%}
.pill{flex:none;font-size:13px;font-weight:800;line-height:1;padding:6px 9px;border-radius:999px;background:var(--p,var(--wool));color:var(--pt,var(--plum));white-space:nowrap}
.pill.neu{--p:var(--pink)} .pill.frei{--p:var(--butter)} .pill.lauf{--p:var(--cobalt);--pt:var(--wool)} .pill.geld{--p:var(--plum);--pt:var(--wool)}
.pill.leer{--p:transparent;--pt:var(--fg);box-shadow:inset 0 0 0 2px var(--line)} .pill.mat{--p:var(--butter)} .pill.schnitt{--p:var(--pink)} .pill.online{--p:var(--clover)}

.back{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;min-height:40px;align-self:flex-start}
.back svg{width:20px;height:20px}
.patch{position:relative;transform:rotate(.8deg)}
.patch canvas{display:block;width:100%;border-radius:18px;background:#1B0620}
.note{font-size:14px;color:var(--soft)}
.bar{height:12px;border-radius:6px;background:rgba(255,243,248,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,var(--butter) 10px 14px);border-radius:6px}
.prog{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:9px 14px;border-radius:999px;font-weight:700;font-size:15px;line-height:1.1;box-shadow:inset 0 0 0 2px var(--fg);transition:transform .18s var(--spring)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.stamp{position:absolute;right:-6px;top:-14px;width:96px;height:96px;display:grid;place-items:center;z-index:2;color:var(--plum);font-weight:800;font-size:17px;pointer-events:none}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp span{position:relative;transform:rotate(-10deg)}

.pad{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--wool);color:var(--plum);transform:rotate(-.6deg)}
.pad textarea{width:100%;min-height:92px;resize:none;border:0;background:transparent;font-size:19px;font-weight:600;line-height:1.3;padding:4px;outline:none;color:var(--plum)}
.pad textarea::placeholder{color:rgba(43,10,51,.68)}
.pad .btn{--act:var(--plum);--act-fg:var(--butter);min-height:52px}
.pad:focus-within{box-shadow:0 0 0 3px var(--plum)}
.err{color:#A30F4F;font-size:15px;font-weight:700}
.wall{columns:2;column-gap:12px}
.st{display:block;width:100%;margin:0 0 12px;break-inside:avoid;padding:14px 14px 12px;border-radius:18px 18px 18px 5px;background:var(--c);color:var(--t);font-weight:700;font-size:16px;line-height:1.24;transform:rotate(var(--r));outline:2px dashed var(--o);outline-offset:-6px;transition:transform .2s var(--spring)}
.st:active{transform:rotate(var(--r)) scale(.96)}
.st small{display:block;margin-top:8px;font-size:13px;font-weight:600}
.st.gone{--c:transparent!important;--t:var(--plum)!important;--o:var(--line)!important;font-weight:600}
.slap{animation:slap .46s var(--spring) both}
@keyframes slap{from{transform:rotate(calc(var(--r) - 16deg)) scale(1.7);opacity:0}}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;min-height:66px;border-radius:14px;background:rgba(255,243,248,.14);font-size:13px;font-weight:700;line-height:1.1;transition:transform .18s var(--spring)}
.day:active{transform:scale(.92)}
.day b{font:800 20px/1.15 var(--body);font-variant-numeric:tabular-nums}
.day i{width:7px;height:7px;border-radius:50%;background:var(--butter);margin-top:2px;visibility:hidden}
.day.has i{visibility:visible}
.day[aria-pressed=true]{background:var(--pink);color:var(--plum)}
.day[aria-pressed=true] i{background:var(--plum)}
.day.today:not([aria-pressed=true]){box-shadow:inset 0 0 0 2px var(--wool)}
.when{flex:none;width:62px;display:flex;flex-direction:column;align-items:flex-start}
.when b{font:800 19px/1.1 var(--body);font-variant-numeric:tabular-nums}
.when small{font-size:13px;color:var(--soft);line-height:1.2}
.ty{flex:none;width:12px;align-self:stretch;min-height:40px;border-radius:6px;background:var(--c)}
.grp{font-weight:800;font-size:17px;margin-top:10px}
.grp:first-child{margin-top:0}

.deal{position:relative;display:flex;flex-direction:column;gap:3px;width:100%;padding:13px 26px;background:var(--wool);color:var(--plum);border-radius:5px;transition:transform .18s var(--spring)}
.deal::before,.deal::after{content:'';position:absolute;top:0;bottom:0;width:15px;border-style:dashed;border-color:rgba(43,10,51,.42);border-width:0}
.deal::before{left:0;border-right-width:2px}
.deal::after{right:0;border-left-width:2px}
.deal:active{transform:scale(.97)}
.deal .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deal .n{font:400 25px/1.05 var(--display)}
.deal small{font-size:15px;line-height:1.25;color:rgba(43,10,51,.82)}
.deal .m{font-weight:800}
.deals{display:flex;flex-direction:column;gap:10px}

.layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(43,10,51,.6);opacity:0;transition:opacity .22s ease}
.layer.open .scrim{opacity:1}
.sheet{--bg:var(--wool);--fg:var(--plum);--soft:rgba(43,10,51,.8);--line:rgba(43,10,51,.32);--act:var(--plum);--act-fg:var(--wool);
  position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:var(--bg);color:var(--fg);border-radius:26px 26px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(102%);transition:transform .36s cubic-bezier(.2,1,.3,1);outline:none}
.layer.open .sheet{transform:none}
.sheet h2{font:400 32px/1.02 var(--display);padding-right:44px;overflow-wrap:anywhere}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.x svg{width:24px;height:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:800;font-size:15px}
.field input,.field select,.field textarea{width:100%;min-height:52px;border-radius:14px;border:2.5px solid var(--plum);background:#FFFAFC;font-size:17px;padding:11px 13px;color:var(--plum)}
.field textarea{resize:none;line-height:1.35}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quote{background:rgba(43,10,51,.07);border-radius:14px;padding:12px 14px;white-space:pre-line;font-size:16px;line-height:1.4}
.fold{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--butter);font-weight:700;overflow-wrap:anywhere}
.fold svg{flex:none;width:26px;height:26px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;box-shadow:inset 0 0 0 2.5px var(--plum)}
.seg button{min-height:46px;border-radius:12px;font-weight:800;font-size:15px;text-align:center;line-height:1.1;padding:4px}
.seg button[aria-pressed=true]{background:var(--plum);color:var(--wool)}

.res{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.res dt{color:var(--soft)}
.res dd{margin:0;font-weight:700;overflow-wrap:anywhere;text-align:right}
.card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--wool);color:var(--plum);--soft:rgba(43,10,51,.8);--fg:var(--plum);--bg:var(--wool);--act:var(--plum);--act-fg:var(--wool)}
.card .field input{min-height:50px}
.verdict{padding:11px 13px;border-radius:12px;font-weight:800;line-height:1.25}
.verdict.ok{background:var(--clover);color:var(--plum)}
.verdict.bad{background:var(--pink);color:var(--plum)}
.verdict.hm{background:var(--butter);color:var(--plum)}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:22px;font-size:16px}

.hem{position:relative;z-index:10;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:8px 4px calc(env(safe-area-inset-bottom) + 6px);color:var(--wool);
  background:repeating-linear-gradient(90deg,#3A1445 0 3px,#22072A 3px 6px)}
.hem::before{content:'';position:absolute;left:0;right:0;top:0;border-top:3px dashed var(--pink)}
.tab{--tab:var(--wool);position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;justify-content:flex-end;font-size:12px;font-weight:700;line-height:1.2;text-align:center}
.tab .ico{width:46px;height:32px;border-radius:12px;display:grid;place-items:center;transition:background-color .2s,color .2s,transform .22s var(--spring)}
.tab .ico svg{width:23px;height:23px}
.tab:active .ico{transform:scale(.88)}
.tab[aria-current=page] .ico{background:var(--tab);color:var(--plum)}
.tab[data-tab=heute]{--tab:var(--pink)} .tab[data-tab=kalender]{--tab:#8C96FF} .tab[data-tab=deals]{--tab:var(--clover)}
.knob{width:66px;height:66px;margin-top:-34px;margin-bottom:1px;transition:transform .42s var(--spring)}
.knob svg{width:66px;height:66px}
.tab:active .knob{transform:scale(.9)}
.tab[aria-current=page] .knob{transform:rotate(135deg) scale(1.05)}

.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px;margin:0 -16px;padding:22px 16px 14px;background:var(--plum)}
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px;padding-top:8px}
.fo{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;width:100%;min-height:94px;padding:10px;border-radius:4px 13px 13px 13px;background:var(--c);color:var(--t);font-weight:800;font-size:15px;line-height:1.14;overflow-wrap:anywhere;outline:2px dashed var(--o);outline-offset:-5px;transition:transform .18s var(--spring)}
.fo::before{content:'';position:absolute;left:0;top:-9px;width:48%;height:11px;border-radius:7px 7px 0 0;background:var(--c)}
.fo:active{transform:scale(.95)}
.fo small{font-size:13px;font-weight:600;line-height:1.2}
.addf{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;padding:8px 12px;border-radius:14px;border:2px dashed var(--line);font-weight:700;font-size:15px;line-height:1.15;text-align:center;transition:transform .18s var(--spring)}
.addf:active{transform:scale(.97)}
.addf svg{width:18px;height:18px;flex:none}
.shelf .addf{grid-column:1/-1;margin-top:-8px;min-height:44px;color:var(--wool);border-color:rgba(255,243,248,.45)}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:8px}
.sp{position:relative;display:flex;align-items:flex-end;min-height:52px;padding:8px 9px;border-radius:4px 12px 12px 12px;box-shadow:inset 0 0 0 2px var(--fg);font-weight:800;font-size:14px;line-height:1.12;overflow-wrap:anywhere;transition:transform .18s var(--spring)}
.sp::before{content:'';position:absolute;left:0;top:-7px;width:46%;height:9px;border-radius:6px 6px 0 0;background:var(--c)}
.sp:active{transform:scale(.95)}
.sp[aria-pressed=true]{background:var(--c);color:var(--t);box-shadow:none}

.gate{--bg:var(--plum);--fg:var(--wool);--soft:rgba(255,243,248,.78);--act:var(--pink);--act-fg:var(--plum);position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);background:var(--bg);color:var(--fg);overflow-y:auto}
.gate-patch{flex:none;transform:rotate(-1.2deg)}
.gate-patch canvas{display:block;width:100%;border-radius:20px;background:#1B0620}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate label{font-weight:800;font-size:17px}
.gate input{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--wool);color:var(--plum);font-size:18px;padding:12px 16px}
.gate .err{color:var(--butter)}
.gate .note{text-align:center}

.toast{position:absolute;z-index:30;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);padding:12px 14px;border-radius:14px;background:var(--plum);color:var(--wool);box-shadow:0 0 0 2px var(--wool);font-weight:700;font-size:15px;line-height:1.25;opacity:0;transform:translateY(14px) rotate(-.6deg);transition:opacity .2s,transform .3s var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:rotate(-.6deg)}
.pop{position:absolute;z-index:31;width:16px;height:16px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 36% 50%,var(--plum) 0 1.4px,transparent 1.9px),radial-gradient(circle at 64% 50%,var(--plum) 0 1.4px,transparent 1.9px),var(--c)}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (min-width:481px){.app{box-shadow:0 0 0 2px rgba(255,243,248,.14)}}
</style>
</head>
<body>
<div class="app" id="app" data-world="heute">
  <header class="top">
    <span class="mark">German Pink Cardigan</span>
    <button class="tag" data-do="proto" id="proto-tag">Prototyp mit Beispielen</button>
  </header>
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="hem" aria-label="Bereiche" id="hem"></nav>
  <div class="layer" id="layer"></div>

class Knit{

  const tick=()=>{const u=V.uploading;if(!u)return;u.p=Math.min(1,(performance.now()-u.t0)/u.ms);updateUpload();if(u.p<1)setTimeout(tick,50);else finishUpload()};

 idea(f){const ta=$('#idea-text',f),err=$('#idea-err',f),t=ta.value.trim();if(!t){err.hidden=false;ta.focus();return}const id='i'+Date.now();S.ideas.unshift({id,space:V.space,folder:V.custom||null,text:t,at:day(0)});save();V.freshIdea=id;paint(false);toast(`Idee für ${SPACES[V.space].short} gespeichert.`);const b=$('#wall');b&&!calm&&b.animate([{transform:'translateY(0)'},{transform:'translateY(5px)'},{transform:'translateY(0)'}],{duration:220,delay:150})},
 folder(f){const inp=$('#f-name',f),err=$('#f-err',f),name=inp.value.trim(),parent=f.dataset.id,msg=folderNameError(parent,name);if(msg){err.textContent=msg;err.hidden=false;inp.focus();return}S.folders.push({id:'c'+Date.now(),parent,name});save();closeSheet();paint(false);toast('Ordner angelegt. Google Drive ist hier noch nicht verbunden.')},
 'folder-edit'(f){const id=f.dataset.id,x=S.folders.find(o=>o.id===id),inp=$('#f-edit',f),err=$('#f-edit-err',f),name=inp.value.trim(),msg=folderNameError(x.parent,name,id);if(msg){err.textContent=msg;err.hidden=false;inp.focus();return}x.name=name;save();closeSheet();paint(false);toast('Name gespeichert.')},
 'idea-edit'(f){const i=S.ideas.find(x=>x.id===f.dataset.id),t=$('#i-text',f).value.trim();if(t){i.text=t;save()}closeSheet();paint(false)},
 video(f){const tt=$('#v-title',f),t=tt.value.trim();if(!t){$('#v-err',f).hidden=false;tt.focus();return}const id='v'+Date.now(),dealId=$('#v-deal',f).value||null;S.videos.unshift({id,space:V.space,folder:V.custom||null,title:t,deal:dealId,status:'leer',clips:[]});
  if(f.dataset.idea){const i=S.ideas.find(x=>x.id===f.dataset.idea);if(i)i.video=id}save();closeSheet();V.tab='videos';V.custom=null;V.video=id;V.test=false;paint(true);toast('Angelegt. Der Drive-Ordner wird hier nur simuliert.')},
 event(f){const tt=$('#e-title',f),t=tt.value.trim();if(!t){$('#e-err',f).hidden=false;tt.focus();return}S.events.push({id:'e'+Date.now(),type:$('#e-type',f).value,title:t,date:$('#e-date',f).value||day(1),time:$('#e-time',f).value||''});save();closeSheet();paint(false);toast('Termin eingetragen. Google Kalender ist hier noch nicht verbunden.')},
 compare(f){const i=+f.dataset.id,t=V.tests[i],inp=$('input',f),mb=parseSize(inp.value);if(!mb){$(`#cmp-err-${i}`,f).hidden=false;inp.focus();return}t.photos=inp.value.trim();const diff=(mb-t.mb)/mb,pct=Math.round(Math.abs(diff)*100);t.verdict=Math.abs(diff)<=.05?{ok:true,text:'Original: Die Größe stimmt mit der Fotos-App überein.'}:diff>0?{ok:false,text:`Verkleinert: Hier kommt das Video ${pct} % kleiner an als in der Fotos-App.`}:{ok:false,text:`Abweichung: Hier ist das Video ${pct} % größer als eingetragen. Prüf die Zahl noch einmal.`};paint(false)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-do]');if(!el)return;const fn=DO[el.dataset.do];if(fn){fn(el,e)}});
document.addEventListener('submit',e=>{e.preventDefault();const fn=FORM[e.target.dataset.form];fn&&fn(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='idea-text'){const p=$('#idea-err');if(p)p.hidden=true}if(e.target.id==='v-title'){const p=$('#v-err');if(p)p.hidden=true}if(e.target.id==='e-title'){const p=$('#e-err');if(p)p.hidden=true}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.classList.contains('open'))closeSheet()});
$('#picker').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length||!V.video)return;startUpload(V.video,fs.map(f=>({name:f.name,mb:f.size/1e6})))});
$('#file-picker').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length||!V.custom)return;(S.files[V.custom]=S.files[V.custom]||[]).push(...fs.map(f=>({name:f.name,mb:f.size/1e6})));save();paint(false);toast(`Simulation: ${fs.length} ${fs.length===1?'Datei':'Dateien'} eingetragen, nichts wurde hochgeladen.`)});
document.addEventListener('change',e=>{if(e.target.id==='v-move'){const v=video(V.video);v.folder=e.target.value||null;save();paint(false);toast('Video verschoben.')}});
$('#test-picker').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;toast('Video wird gelesen.');const m=await videoMeta(f);V.tests.push({name:f.name,mb:f.size/1e6,type:f.type,w:m.w||0,h:m.h||0,sec:m.sec||0});paint(false)});
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TAB_KEYS.includes(t)&&t!==V.tab){V.tab=t;V.folder=null;V.custom=null;V.video=null;V.test=false;paint(true)}});
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>S);

/* Sichtschutz fürs Teilen des Prototyps, kein echter Zugriffsschutz: Alle Inhalte stehen im Quelltext. */
const GATE=3249000435688355,GATE_KEY='gpc-gate-v1';
function gateHash(str,seed=20261106){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
let bootData={};
function boot(d){
  bootData=d;let open=false;
  try{open=localStorage.getItem(GATE_KEY)===String(GATE)}catch{}
  if(open){$('#gate').remove();start(d);return}
  new Knit($('#gate-canvas'),{kind:'title',title:'Pink Cardigan',yarn:[COL.pink,COL.plum,COL.butter],p:1}).knit(900);
}
function start(d){
  load();if(d&&d.videos)S=d;
  const t=location.hash.slice(1);if(TAB_KEYS.includes(t))V.tab=t;
  paint(true);
}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
